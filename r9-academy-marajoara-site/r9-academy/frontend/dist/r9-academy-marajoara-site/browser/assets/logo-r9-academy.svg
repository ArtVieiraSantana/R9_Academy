<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo R9 Academy Marajoara">
  <defs>
    <linearGradient id="r9-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F9BD6"/>
      <stop offset="100%" stop-color="#0E5E96"/>
    </linearGradient>
  </defs>

  <!-- Badge base -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="#FFFFFF"/>
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="url(#r9-blue)" stroke-width="4"/>

  <!-- Letter R -->
  <text x="30" y="80" font-family="'Bebas Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#r9-blue)">R</text>

  <!-- Ball forming the "9" loop -->
  <circle cx="80" cy="45" r="20" fill="#FFFFFF" stroke="url(#r9-blue)" stroke-width="3"/>
  <path d="M80 45 L80 33 M80 45 L91 41 M80 45 L88 55 M80 45 L72 55 M80 45 L69 41" stroke="#0E5E96" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80 45 L80 33" stroke="#F2B705" stroke-width="0" />
  <!-- "9" tail -->
  <path d="M96 48 C96 68 84 80 68 80" fill="none" stroke="#F2B705" stroke-width="7" stroke-linecap="round"/>

  <!-- Small yellow accent dot -->
  <circle cx="80" cy="45" r="21.5" fill="none" stroke="#F2B705" stroke-width="1.5" opacity="0.5"/>
</svg>
