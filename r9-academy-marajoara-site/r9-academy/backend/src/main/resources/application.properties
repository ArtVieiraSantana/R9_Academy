spring.application.name=r9-academy-marajoara-site
server.port=${PORT:8080}

# Mensagens de validacao ficam visiveis (uteis para o formulario), mas nunca
# expomos stacktrace nem detalhes internos do servidor.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Reduz informacao exposta sobre a stack tecnologica do backend.
server.server-header=
